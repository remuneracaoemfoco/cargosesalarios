<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formação em Cargos e Salários VIP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

:root{--bg:#07120d;--bg2:#0b1c14;--card:#0f281d;--card2:#153a2a;--green:#0F4A32;--green2:#0b3826;--gold:#F0A818;--gold2:#ffc850;--orange:#EF4E23;--mint:#6AFFB9;--ink:#10281e;--text:#eef3ef;--mut:#b4c2ba;--paper:#f6f9f7;--blue:#5981e3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:16.5px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
p{margin-bottom:16px}
.gold{color:var(--gold)}
.center{text-align:center}
section{position:relative;padding:72px 20px}
.w{max-width:760px;margin:0 auto}
.m{max-width:900px;margin:0 auto}
.wide{max-width:1080px;margin:0 auto}
h1{font-size:clamp(28px,5.2vw,48px);font-weight:900;line-height:1.14;text-align:center;letter-spacing:-.01em}
h2{font-size:clamp(23px,3.8vw,36px);font-weight:800;line-height:1.22;text-transform:uppercase;text-align:center;margin-bottom:26px}
h1 em,h2 em{font-style:normal;color:var(--gold)}
h3{font-size:19px;font-weight:700;line-height:1.3}
.kicker{display:block;text-align:center;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sub{text-align:center;font-size:clamp(16px,2.3vw,20px);color:var(--text);opacity:.92;max-width:700px;margin:16px auto 0}
.sub b{color:#fff}

/* bar de rascunho */
.draft{position:sticky;top:0;z-index:60;background:var(--orange);color:#fff;font-size:12.5px;font-weight:700;text-align:center;padding:8px 12px;letter-spacing:.02em}
.draft a{color:#fff;text-decoration:underline}

/* CTA */
.ctawrap{text-align:center;margin-top:30px}
.cta{display:inline-flex;align-items:center;gap:12px;justify-content:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(14px,2.3vw,17px);padding:17px 30px;border-radius:8px;text-decoration:none;box-shadow:0 5px 0 #b57c08,0 16px 28px rgba(0,0,0,.45);transition:.15s;max-width:100%;animation:pulse 2.4s ease-in-out infinite}
.cta:hover{transform:translateY(3px);box-shadow:0 2px 0 #b57c08,0 10px 18px rgba(0,0,0,.45)}
.cta svg{font-size:20px}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;font-size:12.5px;color:var(--mut);margin-top:16px}
.trust span{display:inline-flex;align-items:center;gap:6px}

/* pendencias */
.pend{border:2px dashed var(--orange);background:rgba(239,78,35,.12);color:#ffd9cf;border-radius:10px;padding:14px 16px;margin:18px 0;font-size:14px;line-height:1.55;text-align:left;font-weight:500;text-transform:none;letter-spacing:0}
.pend .tag{display:block;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.09em;padding:2px 8px;border-radius:4px;width:fit-content;max-width:100%;margin-bottom:8px}
.sug{border-color:var(--blue);background:rgba(89,129,227,.13);color:#d6e0ff}
.sug .tag{background:var(--blue)}
.paper .pend{color:#7a2a13;background:#fff1ec}
.paper .sug{color:#1f3a86;background:#eaf0ff}

/* HERO */
.hero{padding:34px 20px 80px;background:radial-gradient(ellipse at 85% 10%,rgba(240,168,24,.16),transparent 55%),radial-gradient(ellipse at 10% 40%,rgba(15,74,50,.75),transparent 60%),var(--bg);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;background:linear-gradient(135deg,rgba(15,74,50,.55),rgba(15,74,50,0));transform:rotate(28deg);pointer-events:none}
.hero:before{width:520px;height:900px;right:-180px;top:-200px}
.hero:after{width:380px;height:700px;left:-220px;bottom:-260px;opacity:.7}
.hero .in{position:relative;z-index:2;max-width:760px;margin:0 auto}
.logo{width:210px;margin:0 auto 26px}
.hero .bdg{max-width:520px;margin:0 auto 18px}
.video{max-width:340px;margin:30px auto 0;aspect-ratio:9/16;border:2px dashed var(--gold);border-radius:14px;background:rgba(15,74,50,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--gold);font-weight:700;font-size:15px;box-shadow:0 0 60px rgba(240,168,24,.12)}
.video svg{font-size:54px;margin-bottom:8px}
.video small{color:var(--mut);font-weight:500;margin-top:6px;max-width:420px}

/* faixa rolando */
.band{position:relative;height:150px;margin:-20px 0;overflow:hidden;z-index:3;pointer-events:none}
.band .rib{position:absolute;left:-10%;width:120%;top:54px;padding:14px 0;background:linear-gradient(90deg,var(--green),var(--green2));border-top:1px solid rgba(240,168,24,.4);border-bottom:1px solid rgba(240,168,24,.4);transform:rotate(-2.2deg);white-space:nowrap;overflow:hidden}
.band .rib.b2{top:38px;transform:rotate(1.6deg);opacity:.45;background:var(--card)}
.band .trk{display:inline-flex;gap:28px;animation:mq 38s linear infinite}
.band .rib.b2 .trk{animation-direction:reverse}
.band span.t{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d7e4dc;display:inline-flex;align-items:center;gap:28px}
.band span.t:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

/* B2 dores */
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.pain{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid rgba(240,168,24,.18);border-radius:16px;padding:24px 22px}
.pain .ic{width:44px;height:44px;border-radius:10px;background:var(--green);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(240,168,24,.35)}
.pain p{margin:0;font-size:15.5px;font-weight:500}
.pain b{color:var(--gold)}
.quote{font-size:clamp(18px,2.6vw,24px);font-weight:700;text-align:center;line-height:1.5;margin-top:34px}

/* B3 historia */
.story{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center}
.story .ph{position:relative}
.story .ph img{border-radius:20px;box-shadow:0 0 0 3px rgba(240,168,24,.45),0 30px 60px rgba(0,0,0,.45)}
.story .ph:after{content:"";position:absolute;inset:auto -16px -16px auto;width:60%;height:60%;border-radius:20px;border:2px solid rgba(240,168,24,.35);z-index:-1}
.big{font-size:clamp(28px,5vw,42px);font-weight:900;color:var(--gold);line-height:1.1;margin:6px 0 18px}
.u{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.pill{display:block;width:fit-content;margin:34px auto 0;background:var(--green);border:1px solid rgba(240,168,24,.45);color:#fff;font-weight:700;padding:11px 26px;border-radius:999px;font-size:15px}

/* B4 solucao */
.may{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0 4px}
.may div{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px 18px;font-size:15px;font-weight:600;line-height:1.5;text-align:center;border-bottom:4px solid var(--gold)}

/* paper cards (Prisciane: cartoes brancos) */
.paper-card{background:var(--paper);color:var(--ink);border-radius:22px;padding:44px 34px;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.paper-card:before{content:"";position:absolute;right:-90px;top:-60px;width:320px;height:320px;background:linear-gradient(135deg,rgba(15,74,50,.08),transparent);transform:rotate(28deg)}
.paper-card h2{color:var(--ink);position:relative}
.paper-card h2 em{color:var(--green)}
.paper{color:var(--ink)}

/* B5 depoimentos */
.tscroll{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;position:relative;scroll-snap-type:x mandatory}
.tc{flex:0 0 min(260px,78%);scroll-snap-align:start;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);border:2px dashed var(--orange);padding:14px}
.tc .scr{aspect-ratio:9/14;border-radius:10px;background:repeating-linear-gradient(135deg,#f1f4f2,#f1f4f2 10px,#e7ece9 10px,#e7ece9 20px);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;color:#6a7770;padding:12px}
.tc p{margin:10px 0 0;font-size:13px;color:#56635c;text-align:center}

/* B6 comparativo */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.box{border-radius:16px;padding:28px 26px}
.box h3{text-transform:uppercase;font-size:16px;letter-spacing:.05em;margin-bottom:16px}
.no{background:linear-gradient(180deg,#2e1611,#1c0f0c);border:1px solid rgba(239,78,35,.5)}
.no h3{color:#ff9a7e}
.yes{background:linear-gradient(180deg,#0f3a28,#0a2a1d);border:1px solid rgba(106,255,185,.4)}
.yes h3{color:var(--mint)}
ul.ck{list-style:none}
ul.ck li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-size:15.5px}
ul.ck li .d{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px}
.no .d{background:rgba(239,78,35,.25);color:#ff8a6a}
.yes .d{background:rgba(106,255,185,.22);color:var(--mint)}

/* B7 razoes */
.rg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rc{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid rgba(240,168,24,.2);border-radius:16px;padding:26px 24px}
.rc .ic{width:48px;height:48px;border-radius:50%;background:var(--green);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(240,168,24,.35)}
.rc p{margin:0;font-size:15.5px}

/* B8 dentro */
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.gr .it{background:#fff;border-radius:12px;padding:15px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(15,74,50,.1);font-size:15px;color:#36433c}
.gr .it .c{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px}
.gr .it b{color:var(--ink)}

/* B9 passos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.step{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(240,168,24,.25);border-radius:18px;padding:30px 24px 28px;text-align:center;overflow:hidden}
.step .gh{position:absolute;right:12px;top:-6px;font-size:96px;font-weight:900;color:rgba(240,168,24,.1);line-height:1}
.step .ps{color:var(--gold);font-weight:800;font-size:20px;position:relative}
.step h3{margin:6px 0 12px;font-size:19px;position:relative}
.step p{margin:0;font-size:15px;color:var(--mut);position:relative}

/* B10 qualificacao */
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.qc{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid rgba(106,255,185,.28);border-radius:14px;padding:20px 20px;display:flex;gap:14px}
.qc .ic{flex:none;width:38px;height:38px;border-radius:9px;background:var(--green);color:var(--mint);display:flex;align-items:center;justify-content:center;font-size:19px}
.qc p{margin:0;font-size:15px}
.qc.n{border-color:rgba(239,78,35,.45)}
.qc.n .ic{background:rgba(239,78,35,.22);color:#ff8a6a}
.qh{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px}
.qh.y{color:var(--mint)}.qh.x{color:#ff8a6a;margin-top:34px}

/* B11 modulos */
.mods{display:grid;gap:12px}
.mod{display:flex;gap:18px;align-items:center;background:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 4px 14px rgba(15,74,50,.1)}
.mod .n{flex:none;width:50px;height:50px;border-radius:50%;background:var(--green);color:var(--gold);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(240,168,24,.3)}
.mod h4{font-size:16px;color:var(--ink);margin-bottom:2px}
.mod p{margin:0;font-size:14.5px;color:#56635c}

/* B12 bonus */
.bg{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.bn{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(240,168,24,.3);border-radius:18px;padding:16px 16px 20px;display:flex;flex-direction:column}
.bn.full{grid-column:1/-1;flex-direction:row;gap:22px;align-items:center}
.bn .bt{display:flex;justify-content:space-between;align-items:center;background:var(--orange);color:#fff;border-radius:8px;padding:9px 14px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bn .bt b{font-size:17px;letter-spacing:0}
.bn .img{margin:14px 0;border-radius:12px;overflow:hidden;line-height:0;border:1px solid rgba(240,168,24,.25)}
.bn .img img{display:block;width:100%;height:auto}
.bn h3{text-align:center;color:var(--gold);margin:4px 0 10px;text-transform:uppercase;font-size:18px}
.bn p{font-size:14.5px;color:var(--mut);text-align:center;margin-bottom:14px}
.bn .inc{margin-top:auto;background:linear-gradient(180deg,#1f7a52,#0F4A32);color:#fff;border-radius:8px;padding:12px;text-align:center;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.bn.full .col{flex:1}
.bn.full .img{flex:0 0 38%;margin:0}

/* B13 oferta */
.offer{max-width:520px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.offer .top{background:#fff;color:var(--ink);padding:26px 26px 8px}
.offer .mk{border-radius:12px;overflow:hidden;line-height:0;margin-bottom:12px}
.offer .mk img{display:block;width:100%;height:auto}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e9e6;font-size:15px;font-weight:600;align-items:center}
.row span{display:flex;gap:10px;align-items:center}
.row span svg{color:var(--green);font-size:16px}
.row s{color:#707a74;white-space:nowrap;font-size:14px}
.row:last-child{border-bottom:none}
.offer .bot{background:linear-gradient(180deg,var(--green),var(--green2));padding:26px 26px 30px;text-align:center}
.offer .from{font-size:15px;color:#cfe0d6}
.offer .por{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin:6px 0}
.offer .price{white-space:nowrap;font-size:clamp(30px,7.4vw,44px);font-weight:900;color:#fff;line-height:1.1}
.offer .cash{font-weight:600;color:#cfe0d6;margin-bottom:6px}
.pay{max-width:240px;margin:16px auto 0;opacity:.8}

/* B14 autoridade */
.author{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:center}
.author img{border-radius:22px;box-shadow:0 0 0 3px rgba(240,168,24,.5),0 30px 60px rgba(0,0,0,.4);width:100%}
.author h2{text-align:left;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.stats div{background:var(--card2);border:1px solid rgba(240,168,24,.25);border-radius:10px;padding:12px 14px;font-weight:600;font-size:13.5px;line-height:1.35}
.stats b{color:var(--gold);display:block;font-size:22px;font-weight:900}
blockquote{border-left:4px solid var(--gold);padding-left:18px;font-style:italic;margin-top:10px}

/* B15 garantia */
.guar{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(240,168,24,.4);border-radius:22px;padding:40px 34px}
.seal{display:block;width:170px;height:auto}
.guar h2{text-align:left;margin-bottom:14px}

/* B16 faq */
.fcat{color:var(--gold);text-transform:uppercase;font-size:12.5px;font-weight:800;letter-spacing:.16em;margin:28px 0 10px}
details{background:linear-gradient(180deg,var(--card),var(--bg2));border-radius:10px;margin-bottom:10px;border:1px solid rgba(240,168,24,.2)}
summary{cursor:pointer;padding:16px 48px 16px 18px;font-weight:700;font-size:15.5px;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"";position:absolute;right:20px;top:20px;width:9px;height:9px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);transition:.2s}
details[open] summary:after{transform:rotate(-135deg);top:24px}
details p,details .pend{margin:0 18px 18px;color:var(--mut);font-size:15px}

/* B17 fechamento */
.opt{border-radius:14px;padding:26px 24px;margin-bottom:16px}
.opt h3{text-transform:uppercase;font-size:15.5px;letter-spacing:.06em;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.opt p{margin:0;font-size:15.5px;color:#36433c}
.o1{background:#fff1ec;border:1px solid rgba(239,78,35,.45)}.o1 h3{color:#c23a16}
.o2{background:#e8f7ef;border:1px solid rgba(15,74,50,.4)}.o2 h3{color:var(--green)}
.recap{background:var(--green);color:#fff;border-radius:14px;padding:24px;text-align:center;margin-top:20px}
.recap p{margin:0 0 10px}.recap p:last-child{margin:0}
.final{font-size:clamp(20px,3vw,28px);font-weight:800;text-align:center;margin-top:34px;line-height:1.3}

/* pendencias lista */
.pendlist{background:#fff;color:var(--ink);border-radius:16px;padding:30px}
.pendlist h2{color:var(--green);text-align:left;font-size:22px;margin-bottom:16px}
.pendlist ol{padding-left:22px}.pendlist li{margin-bottom:10px;font-size:14.5px;line-height:1.55}
footer{padding:36px 20px 90px;text-align:center;font-size:12.5px;color:var(--mut)}

.alt{background:var(--bg2)}
.grn{background:linear-gradient(180deg,var(--green2),var(--bg))}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(240,168,24,.4),transparent);max-width:760px;margin:0 auto}

@media(max-width:820px){
 body{font-size:16px}
 section{padding:54px 18px}
 .pains,.may,.steps,.rg,.qg,.gr,.bg,.two,.stats{grid-template-columns:1fr}
 .story,.author{grid-template-columns:1fr;gap:26px}
 .story .ph,.author .ph{max-width:340px;margin:0 auto}
 .guar{grid-template-columns:1fr;text-align:center;padding:32px 22px}
 .guar h2{text-align:center}.seal{margin:0 auto}
 .bn.full{flex-direction:column}.bn.full .img{flex:none;width:100%}
 .paper-card{padding:34px 18px}
 
 .cta{width:100%;padding:17px 14px}
 .band{height:120px;margin:-14px 0}
 .band .rib{top:40px}
}

/* Mockup V2 */
.bn .img.sq{aspect-ratio:1/1;position:relative}
.bn .img.sq img{position:absolute;inset:0;width:100%;height:100%}
.bn .img.tr{background:rgba(0,0,0,.18);border-color:transparent}
.bn .img.tr img{object-fit:contain}
.bn .img.op img{object-fit:cover;object-position:50% 52%}

.wascroll{align-items:flex-start}
.wa{flex:0 0 min(300px,82%);scroll-snap-align:start;background:#e5ddd5;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:14px 12px}
.bub{position:relative;background:#dcf8c6;color:#1b2b22;border-radius:10px 10px 10px 2px;padding:10px 12px 20px;font-size:13.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.13)}
.bub .hr{position:absolute;right:8px;bottom:3px;font-size:11px;color:#4fc3f7}
.wn{margin:10px 0 0;font-size:12.5px;color:#3d4a43;text-align:center}
footer a{color:var(--mut);text-decoration:underline}







/* ===== UPSELL ===== */
:root{--red:#d7263d;--red2:#b3122b;--yellow:#ffe45c}
